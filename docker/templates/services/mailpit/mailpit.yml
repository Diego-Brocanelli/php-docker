services:
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: ${PROJECT_NAME_SNAKE_CASE}_mailpit
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"  # Web UI
    environment:
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAILPIT_URL: http://localhost:${MAILPIT_WEB_PORT:-8025}
