services:
  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME_SNAKE_CASE}_mysql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/templates/services/mysql8.0/config/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./docker/templates/services/mysql8.0/config/conf.d:/etc/mysql/conf.d:ro
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PUBLISHED_PORT: "${DB_PORT:-3306}"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
