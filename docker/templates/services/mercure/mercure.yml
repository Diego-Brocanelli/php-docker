services:
  mercure:
    image: dunglas/mercure:v1.1
    container_name: ${PROJECT_NAME_SNAKE_CASE}_mercure
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MERCURE_PORT:-3000}:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    environment:
      TZ: ${TZ:-UTC}
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET is required}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET is required}
      # Os tokens JWT gerados pela aplicação devem ter o claim "iss" igual a este valor
      MERCURE_TRUSTED_ISSUERS: http://localhost:${PROJECT_PORT:-8080}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:${PROJECT_PORT:-8080}
        anonymous
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:${MERCURE_PORT:-3000}/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
      MERCURE_JWT_ISSUER: http://localhost:${PROJECT_PORT:-8080}

volumes:
  mercure_data:
  mercure_config:
