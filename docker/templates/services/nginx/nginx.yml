services:
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME_SNAKE_CASE}_nginx
    ports:
      - "${PROJECT_PORT}:80"
      - "${PROJECT_HTTPS_PORT}:443"
    volumes:
      - ../../../../:/var/www/html:delegated
      - ../nginx/config/default.base.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - backend

networks:
  backend:
    driver: bridge