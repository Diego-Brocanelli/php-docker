services:
  nginx:
    image: nginx:1.28-alpine
    container_name: ${PROJECT_NAME_SNAKE_CASE}_nginx
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROJECT_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/templates/services/nginx/config/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
