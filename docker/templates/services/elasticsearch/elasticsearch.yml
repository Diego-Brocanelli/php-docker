services:
  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: ${PROJECT_NAME_SNAKE_CASE}_elasticsearch
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      TZ: ${TZ:-UTC}
      discovery.type: single-node
      # Segurança desligada: ambiente de desenvolvimento, porta só em BIND_ADDRESS
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_URL: http://localhost:${ELASTICSEARCH_PORT:-9200}

volumes:
  elasticsearch_data:
