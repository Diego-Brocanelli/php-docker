services:
  mongodb:
    image: mongo:7
    container_name: ${PROJECT_NAME_SNAKE_CASE}_mongodb
    ports:
      - "${DB_PORT}:27017"
    volumes:
      - ../mongodb/storage/data:/data/db
      - ../mongodb/storage/configs/initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    networks:
      - backend

volumes:
  data: