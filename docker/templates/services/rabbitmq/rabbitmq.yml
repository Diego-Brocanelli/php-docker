
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${PROJECT_NAME_SNAKE_CASE}_rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"       # porta para apps se conectarem
      - "${RABBITMQ_WEB_PORT}:15672"  # porta da interface web de administração
    volumes:
      - ../rabbitmq/storage/data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${DB_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${DB_PASSWORD:-app}
    networks:
      - backend

volumes:
  data: