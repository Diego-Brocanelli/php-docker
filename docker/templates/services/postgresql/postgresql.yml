services:
  postgresql:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME_SNAKE_CASE}_postgresql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./docker/templates/services/postgresql/config/initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PUBLISHED_PORT: "${DB_PORT:-5432}"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgresql_data:
