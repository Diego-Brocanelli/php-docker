
services:
  postgresql:
    image: postgres:15
    container_name: ${PROJECT_NAME_SNAKE_CASE}_postgres
    ports:
      - "$DB_PORT:5432"
    volumes:
      - ../postgresql/storage/data:/var/lib/postgresql/data
      - ../postgresql/config/initdb.d:/docker-entrypoint-initdb.d
      - ../postgresql/config/conf.d:/etc/postgresql/conf.d:ro
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - backend

volumes:
  data: