services:
  mariadb:
    image: mariadb:11.8
    container_name: ${PROJECT_NAME_SNAKE_CASE}_mariadb
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/templates/services/mariadb/config/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./docker/templates/services/mariadb/config/conf.d:/etc/mysql/conf.d:ro
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PUBLISHED_PORT: "${DB_PORT:-3306}"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
