services:
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: ${PROJECT_NAME_SNAKE_CASE}_opensearch
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PORT:-9201}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    environment:
      TZ: ${TZ:-UTC}
      discovery.type: single-node
      # Plugin de segurança desligado: ambiente de desenvolvimento, porta só em BIND_ADDRESS
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  php:
    environment:
      OPENSEARCH_HOST: http://opensearch:9200
      OPENSEARCH_URL: http://localhost:${OPENSEARCH_PORT:-9201}

volumes:
  opensearch_data:
